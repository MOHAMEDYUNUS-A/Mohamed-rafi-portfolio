<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d061"/>
      <stop offset="50%" stop-color="#e2b857"/>
      <stop offset="100%" stop-color="#9e7b28"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="48" height="48" rx="12" fill="url(#bg-grad)"/>
  <!-- Gold Border -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="10.5" fill="none" stroke="url(#gold-grad)" stroke-width="1.8"/>
  <!-- Monogram R -->
  <text x="24" y="34.5" text-anchor="middle" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="url(#gold-grad)">R</text>
</svg>